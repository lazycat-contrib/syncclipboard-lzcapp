version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: syncclipboard
build:
  toolchains: []
  run_buildscript: false
images:
  - id: syncclipboard
    target: service
    service: syncclipboard
    source: docker.io/jericx/syncclipboard-server
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    skip_if_version_exists: true
    name: SyncClipboard
    summary: 跨设备剪贴板同步服务端，支持文本和文件同步
